name: collect

# Records one hour of Delhi's live bus GPS three times a day and updates docs/service.json,
# which the public map reads. Times are UTC; Delhi is UTC+5:30.
on:
  schedule:
    - cron: "47 2 * * *"    # 08:17 Delhi: morning rush
    - cron: "47 6 * * *"    # 12:17 Delhi: midday
    - cron: "47 16 * * *"   # 22:17 Delhi: night
  workflow_dispatch:
    inputs:
      slot:
        description: "Which time slot to record this run as"
        required: true
        default: midday
        type: choice
        options: [morning, midday, night]

permissions:
  contents: write
  pages: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      - name: Pick time slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "47 2 * * *")  slot=morning ;;
            "47 6 * * *")  slot=midday ;;
            "47 16 * * *") slot=night ;;
            *)             slot="${{ inputs.slot }}" ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "Recording slot: $slot"

      - name: Record one hour of live bus GPS
        env:
          OTD_API_KEY: ${{ secrets.OTD_API_KEY }}
        run: saajha collect --minutes 60

      - name: Update service.json
        run: saajha summarize --slot ${{ steps.slot.outputs.slot }}

      - name: Commit and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "saajha-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/service.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update ${{ steps.slot.outputs.slot }} bus service"
          git pull --rebase origin main
          git push
          # pushes made by this workflow's token don't always trigger a Pages build, so ask for one
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request skipped"
